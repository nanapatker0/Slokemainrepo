<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sloke | Filmmaker & Street Photographer</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body class="bg-zinc-950 overflow-x-hidden w-full">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- SVG Icon Components ---
    const Icon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Menu = (p) => <Icon {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>;
    const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
    const Play = (p) => <Icon {...p}><polygon points="5 3 19 12 5 21 5 3"/></Icon>;
    const Camera = (p) => <Icon {...p}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></Icon>;
    const Mail = (p) => <Icon {...p}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></Icon>;
    const ArrowRight = (p) => <Icon {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></Icon>;
    const Instagram = (p) => <Icon {...p}><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></Icon>;
    const Globe = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></Icon>;
    const Film = (p) => <Icon {...p}><rect width="20" height="20" x="2" y="2" rx="2.18" ry="2.18"/><line x1="7" x2="7" y1="2" y2="22"/><line x1="17" x2="17" y1="2" y2="22"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="2" x2="7" y1="7" y2="7"/><line x1="2" x2="7" y1="17" y2="17"/><line x1="17" x2="22" y1="17" y2="17"/><line x1="17" x2="22" y1="7" y2="7"/></Icon>;

    // --- Helper function to extract YouTube Thumbnail from link ---
    const getYouTubeThumbnail = (url) => {
      if (!url) return null;
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? `https://img.youtube.com/vi/${match[1]}/maxresdefault.jpg` : null;
    };

    // --- Custom Hooks ---
    const useIntersectionObserver = (options = { threshold: 0.1, triggerOnce: true }) => {
      const [isIntersecting, setIsIntersecting] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        const element = ref.current;
        if (!element) return;

        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            setIsIntersecting(true);
            if (options.triggerOnce) observer.disconnect();
          } else {
            if (!options.triggerOnce) setIsIntersecting(false);
          }
        }, options);

        observer.observe(element);
        return () => observer.disconnect();
      }, [options]);

      return [ref, isIntersecting];
    };

    // --- Data ---
    const PORTFOLIO_ITEMS = [
      { id: 1, title: 'Maidan', category: 'Street', type: 'photo', image: 'images/picture4.jpg' },
      { id: 2, title: 'Ujjain', category: 'Street', type: 'photo', image: 'images/picture3.jpg' },
      { id: 3, title: 'Quiet Hours', category: 'Street', type: 'photo', image: 'images/picture5.jpg' },
      { id: 4, title: 'Hardwork', category: 'Street', type: 'photo', image: 'images/picture6.jpg' },
      { id: 5, title: 'Distraction', category: 'Street', type: 'photo', image: 'images/picture7.jpg' },
      { id: 6, title: 'Emptiness', category: 'Short Films', type: 'film', link: 'https://youtu.be/QHWUnIGle4g?si=OxezrAosSCZyKIt6', image: 'images/picture8.jpg' },
    ];

    const CATEGORIES = ['All', 'Short Films', 'Street', 'Portraits'];

    // --- Components ---
    const FadeIn = ({ children, className = '', delay = 0 }) => {
      const [ref, isVisible] = useIntersectionObserver();
      return (
        <div
          ref={ref}
          style={{ transitionDelay: `${delay}ms` }}
          className={`transition-all duration-1000 ease-out ${
            isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'
          } ${className}`}
        >
          {children}
        </div>
      );
    };

    function HeroSection() {
      const words = ['Visual Storytelling', 'Street Photography', 'Short Films', 'Cinematic Portraits'];
      const [currentWord, setCurrentWord] = useState(0);

      useEffect(() => {
        const interval = setInterval(() => {
          setCurrentWord((prev) => (prev + 1) % words.length);
        }, 3000);
        return () => clearInterval(interval);
      }, [words.length]);

      return (
        <section id="home" className="relative min-h-[100dvh] flex items-center justify-center overflow-hidden">
          <div className="absolute inset-0 z-0">
            <img 
              src="images/picture1.jpg" 
              alt="Cinematic background" 
              className="w-full h-full object-cover opacity-40"
            />
            <div className="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/60 to-transparent" />
            <div className="absolute inset-0 bg-gradient-to-r from-zinc-950 via-transparent to-zinc-950" />
          </div>

          <div className="relative z-10 text-center max-w-4xl px-4 md:px-6 w-full mt-16 md:mt-20">
            <FadeIn>
              <p className="text-pastel-sage font-medium tracking-[0.2em] uppercase text-xs md:text-sm mb-6">
                Sloke Pandey • Filmmaker & Photographer
              </p>
            </FadeIn>
            
            <FadeIn delay={200}>
              <h1 className="text-3xl min-[375px]:text-4xl sm:text-5xl md:text-7xl lg:text-8xl font-cinematic font-bold text-white mb-8 leading-tight">
                Crafting <br className="md:hidden" />
                <span className="relative inline-block w-full h-[1.2em] overflow-hidden align-bottom">
                  {words.map((word, index) => (
                    <span
                      key={word}
                      className={`absolute inset-0 w-full text-pastel-blush transition-all duration-700 ease-in-out whitespace-nowrap ${
                        index === currentWord ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'
                      }`}
                    >
                      {word}
                    </span>
                  ))}
                </span>
              </h1>
            </FadeIn>

            <FadeIn delay={400}>
              <p className="text-zinc-400 max-w-xl mx-auto text-sm md:text-lg mb-10 font-light px-4">
                Capturing the raw rhythm of the streets and compelling visual narratives designed to make you feel.
              </p>
            </FadeIn>

            <FadeIn delay={600} className="flex flex-col sm:flex-row items-center justify-center gap-4">
              <a href="#portfolio" className="group relative w-[180px] text-center px-6 py-2.5 bg-white text-zinc-950 font-semibold rounded-full overflow-hidden transition-all hover:scale-105 text-sm">
                <span className="relative z-10 flex items-center justify-center gap-2 whitespace-nowrap">
                  Explore Work <ArrowRight size={16} className="group-hover:translate-x-1 transition-transform" />
                </span>
                <div className="absolute inset-0 bg-pastel-blush transform scale-x-0 origin-left group-hover:scale-x-100 transition-transform duration-500 ease-out" />
              </a>
              <a href="#contact" className="w-[180px] text-center px-6 py-2.5 text-white font-semibold rounded-full border border-white/20 hover:border-pastel-sage hover:text-pastel-sage transition-all text-sm whitespace-nowrap">
                Start a Project
              </a>
            </FadeIn>
          </div>

          <div className="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 opacity-50 pointer-events-none">
            <span className="text-[10px] md:text-xs font-semibold uppercase tracking-widest text-white">Scroll</span>
            <div className="w-[1px] h-8 bg-white/30 relative overflow-hidden">
                <div className="w-full h-full bg-white animate-scroll-jump" />
            </div>
          </div>
        </section>
      );
    }

    function AboutSection() {
      return (
        <section id="about" className="py-20 md:py-32 px-6 md:px-12 max-w-7xl mx-auto">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-10 md:gap-16 items-center">
            <FadeIn className="order-2 lg:order-1 relative">
              <div className="aspect-[4/5] relative rounded-lg overflow-hidden group">
                <div className="absolute inset-0 bg-pastel-blush mix-blend-overlay opacity-20 group-hover:opacity-0 transition-opacity duration-700 z-10" />
                <img 
                  src="images/picture2.jpg" 
                  alt="Sloke Pandey" 
                  className="w-full h-full object-cover transition-all duration-1000 ease-out scale-105 group-hover:scale-100"
                />
              </div>
              <div className="absolute -bottom-8 -right-4 md:-right-8 w-48 h-48 md:w-64 md:h-64 border border-pastel-sage/30 rounded-full -z-10 animate-[spin_20s_linear_infinite]" />
            </FadeIn>

            <div className="order-1 lg:order-2">
              <FadeIn>
                <h2 className="text-3xl md:text-5xl font-cinematic font-bold text-white mb-4 md:mb-6">
                  The Vision <span className="text-pastel-peach font-serif italic font-light">&</span> The Voice
                </h2>
              </FadeIn>
              
              <FadeIn delay={200}>
                <div className="w-12 h-[2px] bg-pastel-blush mb-6 md:mb-8" />
                <p className="text-zinc-400 text-base md:text-lg mb-4 md:mb-6 leading-relaxed">
                  I believe every street has its own inherent rhythm. My work is dedicated to finding that rhythm through meticulous patience, natural light, and authentic human connection. 
                </p>
                <p className="text-zinc-400 text-base md:text-lg mb-6 md:mb-8 leading-relaxed">
                  From raw street photography to dynamic short films, I approach every frame as a piece of fine art—crafting a cinematic experience that lingers long after the screen goes dark.
                </p>
              </FadeIn>

              <FadeIn delay={400} className="grid grid-cols-2 gap-4 md:gap-8 border-t border-zinc-800 pt-6 md:pt-8">
                <div>
                  <h3 className="text-white font-semibold uppercase tracking-wider text-sm md:text-base mb-1 md:mb-2">Director</h3>
                  <p className="text-zinc-500 text-xs md:text-sm">Visual narratives & Short Films</p>
                </div>
                <div>
                  <h3 className="text-white font-semibold uppercase tracking-wider text-sm md:text-base mb-1 md:mb-2">Photographer</h3>
                  <p className="text-zinc-500 text-xs md:text-sm">Light, Color, & Composition</p>
                </div>
              </FadeIn>
            </div>
          </div>
        </section>
      );
    }

    function PortfolioSection() {
      const [filter, setFilter] = useState('All');
      const [filteredItems, setFilteredItems] = useState(PORTFOLIO_ITEMS);
      const [selectedImage, setSelectedImage] = useState(null);

      useEffect(() => {
        if (filter === 'All') {
          setFilteredItems(PORTFOLIO_ITEMS);
        } else {
          setFilteredItems(PORTFOLIO_ITEMS.filter(item => item.category === filter));
        }
      }, [filter]);

      useEffect(() => {
        if (selectedImage) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = 'auto';
        }
      }, [selectedImage]);

      return (
        <section id="portfolio" className="py-20 md:py-32 bg-zinc-950 relative border-t border-zinc-900">
          <div className="max-w-7xl mx-auto px-4 md:px-12">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 md:gap-8 mb-10 md:mb-16">
              <FadeIn>
                <h2 className="text-3xl md:text-5xl font-cinematic font-bold text-white mb-2 md:mb-4">Selected Works</h2>
                <p className="text-zinc-400 text-sm md:text-base max-w-md">An archive of recent cinematic films and photographic series.</p>
              </FadeIn>

              <FadeIn delay={200} className="flex flex-wrap gap-2 md:gap-3">
                {CATEGORIES.map((cat) => (
                  <button
                    key={cat}
                    onClick={() => setFilter(cat)}
                    className={`px-4 py-1.5 md:px-6 md:py-2 rounded-full text-xs md:text-sm font-medium transition-all duration-300 ${
                      filter === cat 
                        ? 'bg-white text-zinc-950 shadow-[0_0_15px_rgba(252,213,206,0.3)]' 
                        : 'bg-zinc-900 text-zinc-400 hover:text-pastel-blush hover:bg-zinc-800 border border-zinc-800'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </FadeIn>
            </div>

            <div className="grid grid-cols-2 lg:grid-cols-3 gap-3 md:gap-6 auto-rows-[200px] sm:auto-rows-[250px] md:auto-rows-[400px]">
              {filteredItems.map((item, index) => {
                
                const displayImage = (item.type === 'film' && item.link) 
                                      ? (getYouTubeThumbnail(item.link) || item.image) 
                                      : item.image;

                const CardContent = (
                  <React.Fragment>
                    <img 
                      src={displayImage} 
                      alt={item.title} 
                      className="absolute inset-0 w-full h-full object-cover transition-all duration-700 group-hover:scale-105"
                      onError={(e) => {
                        if (e.target.src.includes('maxresdefault')) {
                          e.target.src = e.target.src.replace('maxresdefault', 'hqdefault');
                        }
                      }}
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/40 to-transparent opacity-60 group-hover:opacity-90 transition-opacity duration-300 pointer-events-none" />
                    
                    <div className="absolute inset-0 p-3 md:p-8 flex flex-col justify-between pointer-events-none">
                      <div className="self-end bg-zinc-950/60 backdrop-blur-sm p-2 md:p-3 rounded-full border border-white/10 text-white group-hover:text-pastel-peach transition-colors group-hover:scale-110 duration-300 pointer-events-auto">
                        {item.type === 'film' ? <Play size={16} className="md:w-5 md:h-5" /> : <Camera size={16} className="md:w-5 md:h-5" />}
                      </div>
                      
                      <div className="transform translate-y-2 md:translate-y-4 group-hover:translate-y-0 transition-transform duration-300 pointer-events-auto">
                        <span className="text-pastel-sage text-[10px] md:text-xs font-semibold uppercase tracking-wider mb-1 md:mb-2 block drop-shadow-md">
                          {item.category}
                        </span>
                        <h3 className="text-base sm:text-lg md:text-3xl font-cinematic font-bold text-white group-hover:text-pastel-blush transition-colors leading-tight drop-shadow-lg">
                          {item.title}
                        </h3>
                      </div>
                    </div>
                  </React.Fragment>
                );

                return (
                  <FadeIn 
                    key={item.id} 
                    delay={index * 100} 
                    className={`group relative rounded-lg md:rounded-xl overflow-hidden cursor-pointer ${
                      index === 0 || index === 5 ? 'col-span-2 lg:col-span-2' : 'col-span-1'
                    }`}
                  >
                    {item.link ? (
                      <a href={item.link} target="_blank" rel="noopener noreferrer" className="block w-full h-full absolute inset-0 z-10">
                        {CardContent}
                      </a>
                    ) : (
                      <div 
                        className="block w-full h-full absolute inset-0 z-10 cursor-pointer"
                        onClick={() => setSelectedImage(displayImage)}
                      >
                        {CardContent}
                      </div>
                    )}
                  </FadeIn>
                );
              })}
            </div>

            <FadeIn delay={200} className="mt-16 flex justify-center">
              <a href="more-work.html" className="group relative px-8 py-3.5 border border-white/20 text-zinc-300 hover:text-pastel-blush hover:border-pastel-blush font-semibold rounded-full transition-all text-sm flex items-center justify-center gap-2">
                View More <ArrowRight size={16} className="group-hover:translate-x-1 transition-transform" />
              </a>
            </FadeIn>
            
            {filteredItems.length === 0 && (
              <div className="text-center py-20 text-zinc-500 text-sm md:text-base">
                No projects found in this category.
              </div>
            )}
          </div>

          {selectedImage && (
            <div 
              className="fixed inset-0 z-[200] bg-black/95 flex items-center justify-center p-4 md:p-10 transition-opacity duration-300"
              onClick={() => setSelectedImage(null)}
            >
              <button 
                className="absolute top-6 right-6 md:top-8 md:right-8 text-white/70 hover:text-pastel-blush transition-colors"
                onClick={() => setSelectedImage(null)}
              >
                <X size={36} />
              </button>
              <img 
                src={selectedImage} 
                alt="Fullscreen view" 
                className="max-w-full max-h-full object-contain rounded-md shadow-2xl animate-fade-in"
                onClick={(e) => e.stopPropagation()} 
              />
            </div>
          )}

        </section>
      );
    }

    function ContactSection() {
      return (
        <section id="contact" className="py-20 md:py-32 px-4 md:px-12 relative overflow-hidden">
          <div className="absolute inset-0 bg-zinc-900/30" />
          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] md:w-[800px] md:h-[800px] bg-pastel-blush/5 rounded-full blur-3xl -z-10" />

          <div className="max-w-4xl mx-auto relative z-10 text-center">
            <FadeIn>
              <Film className="w-8 h-8 md:w-12 md:h-12 text-pastel-blush mx-auto mb-4 md:mb-6 opacity-50" />
              <h2 className="text-4xl md:text-7xl font-cinematic font-bold text-white mb-4 md:mb-6">
                Let's create something <br/><span className="italic text-pastel-sage font-light">timeless.</span>
              </h2>
              <p className="text-zinc-400 text-sm md:text-lg mb-8 md:mb-12 max-w-xl mx-auto">
                Available for commissions worldwide. Fill out the form below or reach out directly to discuss your vision.
              </p>
            </FadeIn>

            <FadeIn delay={200} className="bg-zinc-900/60 backdrop-blur-xl border border-zinc-800 p-5 md:p-12 rounded-xl md:rounded-2xl text-left shadow-2xl">
              <form className="space-y-4 md:space-y-6" onSubmit={(e) => e.preventDefault()}>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                  <div className="space-y-1 md:space-y-2">
                    <label className="text-xs md:text-sm text-zinc-400 uppercase tracking-wider font-medium">Name</label>
                    <input 
                      type="text" 
                      className="w-full bg-zinc-950/50 border border-zinc-800 rounded-lg px-3 py-2 md:px-4 md:py-3 text-white focus:outline-none focus:border-pastel-blush transition-colors text-sm md:text-base"
                      placeholder="John Doe"
                    />
                  </div>
                  <div className="space-y-1 md:space-y-2">
                    <label className="text-xs md:text-sm text-zinc-400 uppercase tracking-wider font-medium">Email</label>
                    <input 
                      type="email" 
                      className="w-full bg-zinc-950/50 border border-zinc-800 rounded-lg px-3 py-2 md:px-4 md:py-3 text-white focus:outline-none focus:border-pastel-blush transition-colors text-sm md:text-base"
                      placeholder="john@example.com"
                    />
                  </div>
                </div>
                <div className="space-y-1 md:space-y-2">
                  <label className="text-xs md:text-sm text-zinc-400 uppercase tracking-wider font-medium">Project Details</label>
                  <textarea 
                    rows="3" 
                    className="w-full bg-zinc-950/50 border border-zinc-800 rounded-lg px-3 py-2 md:px-4 md:py-3 text-white focus:outline-none focus:border-pastel-blush transition-colors resize-none text-sm md:text-base"
                    placeholder="Tell me about your vision..."
                  />
                </div>
                <button className="w-full py-3 md:py-4 bg-white text-zinc-950 font-bold rounded-lg hover:bg-pastel-blush hover:text-zinc-950 transition-all duration-300 text-sm md:text-base">
                  Send Inquiry
                </button>
              </form>
            </FadeIn>
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="bg-zinc-950 pt-16 pb-8 md:pt-20 md:pb-10 border-t border-zinc-900">
          <div className="max-w-7xl mx-auto px-6 md:px-12">
            <div className="grid grid-cols-1 md:grid-cols-4 gap-10 md:gap-12 mb-12 md:mb-16">
              <div className="md:col-span-2">
                <a href="#home" className="flex items-center gap-3 mb-3 md:mb-4">
                  <span className="text-3xl font-bold tracking-tighter text-white">SLOKE.</span>
                </a>
                <p className="text-zinc-500 max-w-sm text-sm md:text-base">
                  Premium visual storytelling, capturing raw emotion through a cinematic lens.
                </p>
              </div>
              
              <div>
                <h4 className="text-white font-semibold uppercase tracking-wider text-sm mb-4 md:mb-6">Socials</h4>
                <div className="flex flex-col gap-3 md:gap-4">
                  <a href="https://www.instagram.com/sloke.mov?obrf=MXN3czYyMmZweGlrcQ==" target="_blank" className="text-zinc-400 hover:text-pastel-peach flex items-center gap-2 transition-colors text-sm md:text-base">
                    <Instagram size={16} className="md:w-5 md:h-5"/> Instagram
                  </a>
                  <a href="https://harvishapictures.in" target="_blank" className="text-zinc-400 hover:text-pastel-peach flex items-center gap-2 transition-colors text-sm md:text-base">
                    <Globe size={16} className="md:w-5 md:h-5"/> Harvisha Pictures
                  </a>
                  <a href="mailto:hello@slokepandey.in" className="text-zinc-400 hover:text-pastel-peach flex items-center gap-2 transition-colors text-sm md:text-base">
                    <Mail size={16} className="md:w-5 md:h-5"/> hello@slokepandey.in
                  </a>
                </div>
              </div>

              <div>
                <h4 className="text-white font-semibold uppercase tracking-wider text-sm mb-4 md:mb-6">Studio</h4>
                <address className="not-italic text-zinc-400 space-y-1 md:space-y-2 text-sm md:text-base">
                  <p>Available worldwide</p>
                  <p>Based in Kolkata, West Bengal</p>
                </address>
              </div>
            </div>

            <div className="pt-6 md:pt-8 border-t border-zinc-900 flex flex-col md:flex-row justify-between items-center gap-4 text-xs md:text-sm text-zinc-600">
              <p>© {new Date().getFullYear()} Sloke Pandey. All rights reserved.</p>
              <div className="flex gap-4 md:gap-6">
                <a href="#" className="hover:text-white transition-colors">Privacy Policy</a>
                <a href="#" className="hover:text-white transition-colors">Terms of Service</a>
              </div>
            </div>
          </div>
        </footer>
      );
    }

    function Portfolio() {
      const [isScrolled, setIsScrolled] = useState(() => window.scrollY > 50);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 50);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <div className="w-full min-h-screen bg-zinc-950 text-zinc-200 font-sans selection:bg-[#fcd5ce] selection:text-zinc-900 scroll-smooth overflow-x-hidden">
          <style dangerouslySetInnerHTML={{__html: `
            html { scroll-behavior: smooth; }
            .text-pastel-blush { color: #fcd5ce; }
            .text-pastel-peach { color: #ffdab9; }
            .text-pastel-sage { color: #d8e2dc; }
            .bg-pastel-blush { background-color: #fcd5ce; }
            .border-pastel-blush { border-color: #fcd5ce; }
            .font-cinematic { font-family: 'Playfair Display', Georgia, serif; }
            
            .cinematic-mesh {
              background-image: 
                radial-gradient(at 0% 0%, rgba(252, 213, 206, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(216, 226, 220, 0.03) 0px, transparent 50%);
            }

            @keyframes jumpScroll {
              0% { transform: translateY(-100%); opacity: 0; }
              50% { transform: translateY(0); opacity: 1; }
              100% { transform: translateY(100%); opacity: 0; }
            }
            .animate-scroll-jump {
              animation: jumpScroll 2s infinite ease-in-out;
            }

            @keyframes fadeInModal {
              from { opacity: 0; transform: scale(0.98); }
              to { opacity: 1; transform: scale(1); }
            }
            .animate-fade-in {
              animation: fadeInModal 0.3s ease-out forwards;
            }
          `}} />

          <nav className={`fixed top-0 left-0 w-full z-[110] transition-colors duration-300 ${isScrolled ? 'bg-zinc-950/95 backdrop-blur-md shadow-lg shadow-black/50 border-b border-white/5' : 'bg-transparent'}`}>
            <div className={`max-w-7xl mx-auto px-6 md:px-12 flex justify-between items-center transition-all duration-300 ${isScrolled ? 'h-16 md:h-20' : 'h-20 md:h-28'}`}>
              <a href="#home" className="flex items-center text-2xl font-bold tracking-tighter text-white hover:text-pastel-blush transition-colors relative z-[111]">
                SLOKE.
              </a>

              <div className="hidden md:flex gap-8 text-sm font-medium tracking-wide">
                {['Home', 'About', 'Portfolio', 'Contact'].map((item) => (
                  <a key={item} href={`#${item.toLowerCase()}`} className="relative overflow-hidden group py-1 text-zinc-400 hover:text-white transition-colors">
                    {item}
                    <span className="absolute bottom-0 left-0 w-full h-[1px] bg-pastel-blush transform -translate-x-full group-hover:translate-x-0 transition-transform duration-300 ease-out" />
                  </a>
                ))}
              </div>

              <button 
                className="md:hidden text-zinc-300 hover:text-white flex items-center relative z-[111]"
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
              >
                {mobileMenuOpen ? <X size={28} /> : <Menu size={28} />}
              </button>
            </div>
          </nav>

          <div className={`fixed inset-0 bg-zinc-950 z-[100] flex flex-col items-center justify-center gap-8 transition-all duration-500 ease-in-out md:hidden ${mobileMenuOpen ? 'translate-y-0 opacity-100 pointer-events-auto' : '-translate-y-full opacity-0 pointer-events-none'}`}>
            {['Home', 'About', 'Portfolio', 'Contact'].map((item) => (
              <a 
                key={item} 
                href={`#${item.toLowerCase()}`} 
                onClick={() => setMobileMenuOpen(false)}
                className="text-4xl font-cinematic text-zinc-400 hover:text-pastel-blush transition-colors"
              >
                {item}
              </a>
            ))}
          </div>

          <main className="cinematic-mesh w-full overflow-hidden">
            <HeroSection />
            <AboutSection />
            <PortfolioSection />
            <ContactSection />
          </main>

          <Footer />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Portfolio />);
  </script>
</body>
</html>
